name: CONTRIBUTING compliance

# Diff-scoped gate: validates ONLY the files changed in this PR / push.
# Contributors see issues with their own work — never the chronic backlog
# on untouched older pages. The full-repo audit moved to
# .github/workflows/health-audit.yml; it runs weekly and files an issue,
# never blocks CI.

on:
  pull_request:
    paths:
      - "src/content/docs/**/*.mdx"
      - "scripts/contrib-check.py"
      - "scripts/story-check.py"
      - "tools/hero-dupe-check.py"
      - "tests/**"
      - "CONTRIBUTING.md"
      - "AGENTS.md"
  push:
    branches: [main]
    paths:
      - "src/content/docs/**/*.mdx"
      - "scripts/contrib-check.py"
      - "scripts/story-check.py"
      - "tools/hero-dupe-check.py"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0  # need the parent commit to diff against
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Determine changed MDX files
        id: changed
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          else
            # push to main — check only what the push added/modified.
            base="$PUSH_BEFORE_SHA"
            head="$PUSH_HEAD_SHA"
          fi
          echo "base=$base head=$head"

          # Enumerate changed or added MDX files under src/content/docs.
          files=$(git diff --name-only --diff-filter=ACMR "$base" "$head" \
            | grep -E '^src/content/docs/.*\.mdx$' || true)

          if [ -z "$files" ]; then
            echo "no MDX files changed — nothing to check"
            echo "files=" >> "$GITHUB_OUTPUT"
          else
            echo "changed MDX files:"
            echo "$files" | sed 's/^/  /'
            # Collapse to space-separated for the next step.
            joined=$(echo "$files" | tr '\n' ' ')
            echo "files=$joined" >> "$GITHUB_OUTPUT"
          fi

      - name: Run CONTRIBUTING checker
        if: steps.changed.outputs.files != ''
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        run: |
          # shellcheck disable=SC2086
          python3 scripts/contrib-check.py $CHANGED_FILES

      # The narrative half of the standard — same diff scope. Errors block;
      # warnings are advisory (Tommy keeps one on purpose).
      - name: Run narrative checker (story-check)
        if: steps.changed.outputs.files != ''
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        run: |
          # shellcheck disable=SC2086
          python3 scripts/story-check.py $CHANGED_FILES

      # Calibration contract: the checkers' thresholds are anchored to named
      # gold-standard pages (tests/test_story_check.py). Any edit to the
      # checkers, the tools, or those anchor pages must keep the contract.
      - name: Calibration contract (pytest)
        run: |
          python3 -m pip install --quiet pytest pillow
          python3 -m pytest tests/ -q
