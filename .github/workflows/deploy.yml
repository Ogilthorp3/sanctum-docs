name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write
    steps:
      # Shallow clone is enough: the compliance gate now checks the whole
      # corpus at the current commit, so no history is needed. fetch-depth: 0
      # was only ever here to let the old changed-files gate diff against
      # github.event.before.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # ── Compliance gate ──────────────────────────────────────────────────
      # contrib-check.yml runs on PRs, but it and this workflow both trigger
      # independently on push to main with no dependency between them — so a
      # direct push could (and did, 2026-07-26) deploy a page whose compliance
      # check was red. This closes that hole at the gate that matters.
      #
      # FULL CORPUS. This was scoped to changed-files-only when it was added,
      # because the corpus then failed on 12 pages (10 predating the change) and
      # gating on that would have blocked every deploy until unrelated backlog
      # was cleared. That backlog is now cleared — the last hero images landed
      # 2026-07-27 (b2192bc) and the full corpus reports 0 errors — so the
      # narrow scope has no remaining justification and the strict gate is on.
      #
      # Only ERRORS fail the build; contrib-check exits 0 on warnings. The 46
      # outstanding warnings are Five-Minute Rule length overruns on long
      # reference pages, which are a judgement call, not a build breaker.
      #
      # If this ever blocks a deploy, fix the page — do not re-narrow the scope.
      - name: CONTRIBUTING compliance (full corpus)
        run: python3 scripts/contrib-check.py $(find src/content/docs -name '*.mdx')

      # ── Narrative standard gate ──────────────────────────────────────────
      # story-check is the OTHER half of the standard: contrib-check proves a
      # page is correct, story-check proves someone will read it (hook, spine,
      # cast, landing). The 2026-07 sweep drove the corpus to 0 errors; this
      # gate keeps it there. Errors fail; warnings are advisory (the gold
      # standard itself carries one permanent warning by design).
      - name: Narrative standard (full corpus)
        run: python3 scripts/story-check.py $(find src/content/docs -name '*.mdx')

      # ── Hero uniqueness gate ─────────────────────────────────────────────
      # Perceptual hash (dHash+aHash): two pages must never share visually-
      # identical art even when the bytes differ — MD5 is blind to that, and
      # 11 such clusters shipped before this gate existed (2026-07-30).
      # Fails on any duplicate cluster: regenerate the duplicate hero, do not
      # lower the threshold.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Hero uniqueness (perceptual hash)
        run: |
          python3 -m pip install --quiet pillow
          python3 tools/hero-dupe-check.py . 10

      - run: pnpm build

      - uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=sanctum-docs
