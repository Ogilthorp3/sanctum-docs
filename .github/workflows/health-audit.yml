name: Docs health audit

# Weekly full-repo CONTRIBUTING.md audit. Runs the same `contrib-check.py`
# the PR gate uses, but against the entire docs tree — catches drift on
# pages no PR touched, plus violations that older pages predate today's
# rules.
#
# The workflow always succeeds. When violations are found it opens (or
# updates) a tracking issue labelled `docs-audit`, which is the durable
# signal we triage from. Failing CI on every push for pre-existing
# backlog burns the badge for community contributors and tells them
# nothing actionable about their own work.

on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run full-repo CONTRIBUTING check
        id: check
        run: |
          set +e
          out_contrib=$(python3 scripts/contrib-check.py 2>&1)
          ec_contrib=$?
          # Narrative half of the standard (errors surface in the issue too).
          # Capture exit BEFORE the tail — $? after a pipeline is tail's exit.
          out_story_full=$(python3 scripts/story-check.py $(find src/content/docs -name '*.mdx') 2>&1)
          ec_story=$?
          out_story=$(printf '%s' "$out_story_full" | tail -60)
          # Corpus sameness advisory — never gates, only names the echoes
          out_echo=$(python3 scripts/echo-audit.py 2>&1)
          out=$(printf '%s\n\n───── narrative standard (story-check) ─────\n%s\n\n───── echo audit (corpus sameness, advisory) ─────\n%s\n' \
            "$out_contrib" "$out_story" "$out_echo")
          ec=$(( ec_contrib != 0 || ec_story != 0 ? 1 : 0 ))
          {
            echo 'output<<__EOF__'
            echo "$out"
            echo '__EOF__'
            echo "exit_code=$ec"
            err_count=$(echo "$out" | grep -c '^FAIL:' || true)
            warn_count=$(echo "$out" | grep -c '^warn:' || true)
            echo "err_count=$err_count"
            echo "warn_count=$warn_count"
          } >> "$GITHUB_OUTPUT"
          # Always succeed — failures get reported via the tracking issue.
          exit 0

      - name: Ensure docs-audit label exists
        if: steps.check.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create docs-audit \
            --repo "${{ github.repository }}" \
            --color "BFD4F2" \
            --description "Tracked by the weekly contrib-check audit" \
            2>/dev/null || true

      - name: Open or update tracking issue
        if: steps.check.outputs.exit_code != '0'
        env:
          GH_TOKEN:     ${{ secrets.GITHUB_TOKEN }}
          AUDIT_OUTPUT: ${{ steps.check.outputs.output }}
          ERR_COUNT:    ${{ steps.check.outputs.err_count }}
          WARN_COUNT:   ${{ steps.check.outputs.warn_count }}
          RUN_URL:      ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -eu
          ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          body=$(cat <<BODY
          Tracking issue for the weekly full-repo \`contrib-check.py\` audit. PR
          CI only validates *changed* files; this issue captures the backlog
          of pre-existing violations on untouched pages so they're visible
          without painting the badge red on every push.

          - **Last audit:** $ts
          - **Errors:** $ERR_COUNT
          - **Warnings:** $WARN_COUNT
          - **Workflow run:** $RUN_URL

          The body is replaced on each weekly run, so this issue always
          shows the current state. Close it when the audit is clean and
          the next run will reopen it if regressions appear.

          ## Violations

          \`\`\`
          $AUDIT_OUTPUT
          \`\`\`
          BODY
          )

          existing=$(gh issue list \
            --repo "${{ github.repository }}" \
            --label docs-audit \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "$existing" ]; then
            echo "Updating existing audit issue #$existing"
            gh issue edit "$existing" \
              --repo "${{ github.repository }}" \
              --body "$body"
          else
            echo "Opening new audit issue"
            gh issue create \
              --repo "${{ github.repository }}" \
              --title "Docs CONTRIBUTING compliance backlog" \
              --label docs-audit \
              --body "$body"
          fi

      - name: Close tracking issue when clean
        if: steps.check.outputs.exit_code == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          existing=$(gh issue list \
            --repo "${{ github.repository }}" \
            --label docs-audit \
            --state open \
            --json number \
            --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "Audit clean — closing #$existing"
            gh issue close "$existing" \
              --repo "${{ github.repository }}" \
              --comment "Audit clean as of $(date -u +%Y-%m-%dT%H:%M:%SZ). Auto-closed by Docs health audit."
          else
            echo "Audit clean — no open issue to close."
          fi

      # The echo audit is ADVISORY, so it must be visible on a clean run — the
      # normal case. Routing it only through the failure-only tracking issue
      # made it silently useless (verified 2026-07-31: a clean dispatch printed
      # zero note lines). The job summary always renders.
      - name: Corpus sameness advisory (always visible)
        if: always()
        env:
          EXIT_CODE: ${{ steps.check.outputs.exit_code }}
          ERR_COUNT: ${{ steps.check.outputs.err_count }}
          WARN_COUNT: ${{ steps.check.outputs.warn_count }}
        run: |
          # Capture once, emit twice: stdout so the run log proves it ran, and
          # the step summary so a human reads it without opening logs.
          echo_out=$(python3 scripts/echo-audit.py 2>&1 || true)
          echo "$echo_out"
          {
            echo "## Docs health — $(date -u +%Y-%m-%d)"
            echo ""
            echo "| gate | result |"
            echo "|------|--------|"
            echo "| contrib + story errors | ${ERR_COUNT:-0} |"
            echo "| warnings | ${WARN_COUNT:-0} |"
            echo "| combined exit | ${EXIT_CODE:-0} |"
            echo ""
            echo "### Echo audit — is the book still varying its music?"
            echo ""
            echo '```'
            echo "$echo_out"
            echo '```'
            echo ""
            echo "Budgets are taste, written down. Over-budget is a nudge to vary"
            echo "the device on the next pages you touch — never a build failure."
          } >> "$GITHUB_STEP_SUMMARY"
